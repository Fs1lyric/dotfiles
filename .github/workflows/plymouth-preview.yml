name: plymouth-preview
on:
  push:
    paths: [plymouth/**, .github/workflows/plymouth-preview.yml]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pacman -Syu --noconfirm plymouth imagemagick ttf-roboto-mono xorg-server-xvfb xdotool
      - name: Bake and install theme
        run: |
          magick -size 1920x1080 plasma:steelblue-gray20 -blur 0x3 wall.png
          d=/usr/share/plymouth/themes/lyric
          plymouth/gen.sh wall.png "$d" archy
          cp plymouth/lyric/lyric.{plymouth,script} "$d"/
          plymouth-set-default-theme lyric
      - name: Render prompt
        run: |
          mkdir -p /run/plymouth shots
          Xvfb :99 -screen 0 1920x1080x24 & sleep 2
          export DISPLAY=:99
          plymouthd --debug --debug-file=plymouthd.log --no-daemon \
            --kernel-command-line="splash plymouth.ignore-udev" &
          sleep 3
          plymouth show-splash; sleep 2
          import -window root shots/1-splash.png
          plymouth ask-for-password --prompt="Password for cryptroot" > /dev/null &
          sleep 2
          import -window root shots/2-empty.png
          xdotool search --class plymouth windowfocus 2>/dev/null || true
          xdotool type --delay 80 hunter2; sleep 1
          import -window root shots/3-typed.png
          xdotool key Return; sleep 2
          import -window root shots/4-unlocked.png
          plymouth quit || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plymouth-preview
          path: |
            shots
            plymouthd.log
